name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Bot-created version PRs need a manual check run unless an App token is used.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: this workflow only builds and tests.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Parse every changeset without requiring a base ref or a new bump on version PRs.
      - run: npm run changeset:check
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=moderate
      - run: npm run pack:check
